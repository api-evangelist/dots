name: Dots
description: 'Dots is a mobile games studio founded in 2013 by Paul Murphy and Patrick Moberg,
  known for minimalist, calming puzzle games including Dots, Two Dots, and Dots & Co. The studio
  focused on well-designed, easy-to-approach games and player-friendly monetization, measuring
  success by how players feel rather than aggressive in-app spending. Backed by Northzone, Slow
  Ventures, Tencent, Greycroft, and CrunchFund, Dots was acquired by Take-Two Interactive in
  August 2020. This is a consumer gaming company with no public developer API surface; it was
  added to the API Evangelist network as a VC-portfolio stub and this enrichment pass confirmed
  it exposes no API, SDK, or documentation.'
